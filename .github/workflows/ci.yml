name: LawPedia CI & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Module Imports & App Init
        run: python -c "from backend.main import app; print('App initialization succeeded!')"

      - name: Run Pytest Suite with Coverage
        run: python -m pytest --cov=backend --cov-report=term-missing

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts

      - name: Build Frontend Production SPA
        run: |
          cd frontend
          npm run build

  secret-scanning:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Codebase for Leaked API Keys & Credentials
        run: |
          echo "Scanning for AIza, sk-, and private key patterns..."
          if grep -rn -E "AIza[0-9A-Za-z-_]{35}|sk-[0-9A-Za-z-_]{32,}|-----BEGIN" --exclude-dir={.git,node_modules,dist,venv} .; then
            echo "ERROR: Leaked API key or private secret detected!"
            exit 1
          else
            echo "SUCCESS: No secret keys detected in repository."
          fi
