# Render.com Blueprint Specification for LawPedia
# https://render.com/docs/blueprint-spec

services:
  # Production Full-Stack Web Service (FastAPI + Built React Static Assets)
  - type: web
    name: lawpedia-platform
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: LAWPEDIA_DEMO_MODE
        value: "true"
      - key: LAWPEDIA_DEMO_TOKEN
        value: lawpedia_demo_token_2026
      - key: LAWPEDIA_SECRET_KEY
        generateValue: true
      - key: MIN_CONFIDENCE_THRESHOLD
        value: "0.30"
      - key: PYTHON_VERSION
        value: 3.11.8
